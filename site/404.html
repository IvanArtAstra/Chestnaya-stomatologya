<script>
/* @view-transition включён для всех страниц; пропущенный переход (вкладка
   скрыта, переход прерван) отклоняет его промисы — штатно, но без catch в
   консоли «Uncaught (in promise) AbortError». Глушим на каждой странице. */
(function(){var q=function(vt){if(!vt)return;["ready","finished","updateCallbackDone"].forEach(function(k){var p=vt[k];if(p&&p.catch)p.catch(function(){});});};
addEventListener("pagereveal",function(e){q(e.viewTransition);});addEventListener("pageswap",function(e){q(e.viewTransition);});})();
</script>
